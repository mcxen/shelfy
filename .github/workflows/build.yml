name: Release

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  validate:
    name: Validate version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Match tag and application versions
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          node scripts/check-release-contract.mjs "$VERSION"

  build:
    name: Build ${{ matrix.name }}
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64
            artifact: windows-x64
            platform: windows-latest
            args: ""
          - name: Linux x64
            artifact: linux-x64
            platform: ubuntu-22.04
            args: ""
          - name: macOS Universal
            artifact: macos-universal
            platform: macos-15
            args: "--target universal-apple-darwin"

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode 16.4
        if: matrix.platform == 'macos-15'
        run: sudo xcode-select -s /Applications/Xcode_16.4.app/Contents/Developer

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.17.0
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.96.0
          targets: ${{ matrix.platform == 'macos-15' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf

      - name: Install frontend dependencies
        run: npm ci

      - name: Build desktop bundle
        shell: bash
        run: |
          set -euo pipefail
          if [ -n "${{ matrix.args }}" ]; then
            npm run tauri build -- ${{ matrix.args }}
          else
            npm run tauri build
          fi

      - name: Collect Windows assets
        if: matrix.platform == 'windows-latest'
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          mkdir -p release-assets
          cp src-tauri/target/release/bundle/msi/*.msi release-assets/
          cp src-tauri/target/release/bundle/nsis/*.exe release-assets/
          cp src-tauri/target/release/shelfy.exe "release-assets/Shelfy_${VERSION}_x64-portable.exe"

      - name: Collect Linux assets
        if: matrix.platform == 'ubuntu-22.04'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-assets
          cp src-tauri/target/release/bundle/appimage/*.AppImage release-assets/
          cp src-tauri/target/release/bundle/deb/*.deb release-assets/
          cp src-tauri/target/release/bundle/rpm/*.rpm release-assets/

      - name: Collect macOS assets
        if: matrix.platform == 'macos-15'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-assets
          BUNDLE_ROOT="src-tauri/target/universal-apple-darwin/release/bundle"
          cp "$BUNDLE_ROOT"/dmg/*.dmg release-assets/
          VERSION="${GITHUB_REF_NAME#v}"
          codesign --force --deep --sign - --identifier cc.shelfy.app --timestamp=none \
            "$BUNDLE_ROOT/macos/Shelfy.app"
          bash scripts/verify-macos-release.sh "$BUNDLE_ROOT/macos/Shelfy.app" "$VERSION"
          tar -czf release-assets/Shelfy_universal.app.tar.gz -C "$BUNDLE_ROOT/macos" Shelfy.app
          ditto -c -k --sequesterRsrc --keepParent \
            "$BUNDLE_ROOT/macos/Shelfy.app" \
            "release-assets/Shelfy_v${VERSION}_universal-apple-darwin.app.zip"

      - name: Upload platform assets
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.artifact }}
          path: release-assets/*
          if-no-files-found: error

  publish:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download platform assets
        uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: downloaded-assets

      - name: Flatten and verify release assets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-assets
          while IFS= read -r -d '' asset; do
            target="release-assets/$(basename "$asset")"
            test ! -e "$target" || {
              echo "duplicate release asset: $(basename "$asset")" >&2
              exit 1
            }
            mv "$asset" "$target"
          done < <(find downloaded-assets -type f -print0)

          VERSION="${GITHUB_REF_NAME#v}"
          required=(
            "Shelfy_${VERSION}_universal.dmg"
            "Shelfy_universal.app.tar.gz"
            "Shelfy_v${VERSION}_universal-apple-darwin.app.zip"
            "Shelfy_${VERSION}_x64_en-US.msi"
            "Shelfy_${VERSION}_x64-setup.exe"
            "Shelfy_${VERSION}_x64-portable.exe"
            "Shelfy_${VERSION}_amd64.AppImage"
            "Shelfy_${VERSION}_amd64.deb"
            "Shelfy-${VERSION}-1.x86_64.rpm"
          )
          for asset in "${required[@]}"; do
            test -s "release-assets/$asset" || {
              echo "missing or empty release asset: $asset" >&2
              exit 1
            }
          done
          find release-assets -maxdepth 1 -type f -printf '%f\n' | sort

      - name: Generate updater assets
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          VERSIONED="Shelfy_v${VERSION}_universal-apple-darwin.app.zip"
          STABLE="Shelfy_universal-apple-darwin.app.zip"
          cp "release-assets/$VERSIONED" "release-assets/$STABLE"
          SHA256="$(sha256sum "release-assets/$STABLE" | awk '{print $1}')"
          SIZE="$(stat -c %s "release-assets/$STABLE")"
          jq -n \
            --arg version "$VERSION" \
            --arg tag "$GITHUB_REF_NAME" \
            --arg asset_name "$STABLE" \
            --arg asset_url "https://github.com/mcxen/shelfy/releases/latest/download/$STABLE" \
            --arg sha256 "$SHA256" \
            --argjson size "$SIZE" \
            '{version:$version,tag:$tag,platform:"macos",target:"universal-apple-darwin",asset_name:$asset_name,asset_url:$asset_url,sha256:$sha256,size:$size,notes:""}' \
            > release-assets/latest.json
          test -s release-assets/latest.json
          test -s "release-assets/$STABLE"
          test "$(jq -r .asset_name release-assets/latest.json)" = "$STABLE"
          test "$(jq -r .asset_url release-assets/latest.json)" = "https://github.com/mcxen/shelfy/releases/latest/download/$STABLE"

      - name: Write release notes
        shell: bash
        run: |
          cat > release-notes.md <<'EOF'
          ## Downloads
          - **macOS**: universal `.dmg`, `.app.tar.gz`, or verified in-app update (Apple Silicon and Intel; unsigned)
          - **Windows**: `.msi`, `-setup.exe`, or portable `.exe`
          - **Linux**: `.AppImage`, `.deb`, or `.rpm`

          See the commit history for the complete changes.
          EOF

      - name: Create or update GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          mapfile -d '' assets < <(find release-assets -maxdepth 1 -type f -print0 | sort -z)
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "${assets[@]}" --clobber
          else
            gh release create "$GITHUB_REF_NAME" "${assets[@]}" \
              --title "Shelfy $GITHUB_REF_NAME" \
              --notes-file release-notes.md
          fi
